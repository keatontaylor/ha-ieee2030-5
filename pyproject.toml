[project]
name = "ha-ieee2030-5"
version = "0.1.0"
requires-python = ">=3.14.2"
description = "Local Home Assistant metering for Xcel/Itron and IEEE 2030.5 devices"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.10.0",
  "pytest-homeassistant-custom-component==0.13.371",
  "ruff==0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --timeout=120"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
